server:
  port: 8081

spring:
  application:
    name: platform-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pm_platform
    username: ${POSTGRES_USER:pm_user}
    password: ${POSTGRES_PASSWORD:pm_pwd1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    validate-migration-naming: true

  security:
    user:
      name: suser
      password: pwd123

logging:
    level:
      org.springframework.web: DEBUG