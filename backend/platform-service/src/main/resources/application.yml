server:
  port: 8081

spring:
  application:
    name: platform-service

  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:personal_manager}
    username: ${POSTGRES_USER:pm_user}
    password: ${POSTGRES_PASSWORD:pm_pwd1234}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false