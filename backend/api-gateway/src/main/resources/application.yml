server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: platform-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=2

        - id: vault-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/vault/**
          filters:
            - StripPrefix=2
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive.handler.SimpleUrlHandlerMapping: TRACE